services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatterbox
      POSTGRES_PASSWORD: chatterbox
      POSTGRES_DB: chatterbox
    ports:
      - "5432:5432"
    volumes:
      - chatterbox_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # Force shared_preload_libraries empty so extensions in an ambient postgres
    # config (e.g. pg_stat_statements) don't fail the container on boot. Drop
    # this override if you actually want to preload an extension.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries="

volumes:
  chatterbox_pg_data:
